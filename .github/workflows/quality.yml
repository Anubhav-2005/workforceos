name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code quality
        run: npm run check

      - name: Test workflow logic
        run: npm test

      - name: Check dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
